<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drop Inn — Investor Portal Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--cream:#F2EDE4;--sand:#C9A882;--bark:#6B4C35;--brown:#3D2B1F;--charcoal:#1A1A1A;--white:#fff;--mid:#888;}
body{font-family:'Barlow',sans-serif;background:#1a1209;color:var(--white);min-height:100vh;}
.editor-shell{display:grid;grid-template-columns:360px 1fr;min-height:100vh;}
.sidebar{background:#120d07;border-right:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;overflow-y:auto;}
.sidebar-header{padding:28px 28px 20px;border-bottom:1px solid rgba(255,255,255,.07);}
.sidebar-brand{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.1em;color:var(--white);}
.sidebar-title{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sand);margin-top:4px;}
.sidebar-body{padding:24px 28px;flex:1;}
.form-group{margin-bottom:28px;}
.form-group-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:14px;display:block;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:rgba(255,255,255,.5);margin-bottom:6px;letter-spacing:.04em;}
.field input[type="text"],.field input[type="email"],.field input[type="number"]{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:3px;padding:10px 12px;font-family:'Barlow',sans-serif;font-size:14px;color:var(--white);outline:none;transition:border-color .2s;}
.field input:focus{border-color:var(--sand);}
.field input::placeholder{color:rgba(255,255,255,.2);}
.pdf-slot{border:1px dashed rgba(201,168,130,.3);border-radius:4px;padding:20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;position:relative;margin-bottom:14px;}
.pdf-slot:hover{border-color:var(--sand);background:rgba(201,168,130,.05);}
.pdf-slot input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.pdf-slot-icon{font-size:28px;margin-bottom:8px;opacity:.5;}
.pdf-slot-name{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sand);margin-bottom:4px;}
.pdf-slot-hint{font-size:12px;color:rgba(255,255,255,.3);}
.pdf-slot.loaded{border-color:rgba(201,168,130,.7);background:rgba(201,168,130,.08);}
.pdf-slot.loaded .pdf-slot-hint{color:rgba(201,168,130,.8);}
.pdf-slot-clear{position:absolute;top:8px;right:8px;width:20px;height:20px;background:rgba(255,255,255,.1);border-radius:50%;border:none;color:var(--white);cursor:pointer;font-size:12px;display:none;align-items:center;justify-content:center;z-index:2;}
.pdf-slot.loaded .pdf-slot-clear{display:flex;}
.sidebar-footer{padding:20px 28px 28px;border-top:1px solid rgba(255,255,255,.07);}
.btn-generate{width:100%;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;background:var(--sand);color:var(--brown);border:none;padding:16px;border-radius:3px;cursor:pointer;transition:background .2s,transform .15s;font-weight:700;}
.btn-generate:hover{background:#d4b48e;transform:translateY(-1px);}
.btn-generate:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.status-msg{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.3);text-align:center;margin-top:10px;min-height:16px;}
.status-msg.ok{color:rgba(150,220,150,.8);}
.status-msg.err{color:rgba(220,100,100,.8);}
.preview-pane{background:#0e0a05;display:flex;flex-direction:column;}
.preview-bar{padding:14px 24px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px;}
.preview-bar-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);}
.preview-frame-wrap{flex:1;padding:24px;overflow:auto;}
.preview-frame-wrap iframe{width:100%;height:100%;min-height:700px;border:none;border-radius:4px;background:var(--cream);}
@media(max-width:900px){.editor-shell{grid-template-columns:1fr;}.preview-pane{display:none;}}
</style>
</head>
<body>
<div class="editor-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">Drop Inn</div>
      <div class="sidebar-title">Investor Portal Editor</div>
    </div>
    <div class="sidebar-body">
      <div class="form-group">
        <span class="form-group-label">Investor Details</span>
        <div class="field">
          <label>Investor Name</label>
          <input type="text" id="f-name" placeholder="e.g. Sarah Johnson" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Investment Amount (optional)</label>
          <input type="text" id="f-amount" placeholder="e.g. 250000" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Contact Email</label>
          <input type="email" id="f-email" placeholder="hello@dropinn.com" oninput="updatePreview()">
        </div>
      </div>
      <div class="form-group">
        <span class="form-group-label">Operating Agreement</span>
        <div class="pdf-slot" id="slot-operating" onclick="document.getElementById('file-operating').click()">
          <button class="pdf-slot-clear" id="clear-operating" onclick="clearPdf('operating', event)">&#x2715;</button>
          <input type="file" id="file-operating" accept="application/pdf" onchange="loadPdf('operating', this)">
          <div class="pdf-slot-icon">&#x1F4C4;</div>
          <div class="pdf-slot-name">Operating Agreement</div>
          <div class="pdf-slot-hint" id="hint-operating">Click to upload PDF</div>
        </div>
      </div>
      <div class="form-group">
        <span class="form-group-label">Commitment Letter</span>
        <div class="pdf-slot" id="slot-commitment" onclick="document.getElementById('file-commitment').click()">
          <button class="pdf-slot-clear" id="clear-commitment" onclick="clearPdf('commitment', event)">&#x2715;</button>
          <input type="file" id="file-commitment" accept="application/pdf" onchange="loadPdf('commitment', this)">
          <div class="pdf-slot-icon">&#x2709;&#xFE0F;</div>
          <div class="pdf-slot-name">Commitment Letter</div>
          <div class="pdf-slot-hint" id="hint-commitment">Click to upload PDF</div>
        </div>
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="btn-generate" id="btn-gen" onclick="generate()">Generate Investor Page</button>
      <div class="status-msg" id="status-msg"></div>
    </div>
  </aside>
  <div class="preview-pane">
    <div class="preview-bar"><span class="preview-bar-label">Live Preview</span></div>
    <div class="preview-frame-wrap"><iframe id="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe></div>
  </div>
</div>
<script>
const pdfs = { operating: null, commitment: null };
function loadPdf(key, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    pdfs[key] = e.target.result;
    document.getElementById('slot-' + key).classList.add('loaded');
    document.getElementById('hint-' + key).textContent = file.name;
    updatePreview();
  };
  reader.readAsDataURL(file);
}
function clearPdf(key, e) {
  e.stopPropagation();
  pdfs[key] = null;
  document.getElementById('slot-' + key).classList.remove('loaded');
  document.getElementById('hint-' + key).textContent = 'Click to upload PDF';
  document.getElementById('file-' + key).value = '';
  updatePreview();
}
function buildHtml() {
  const name = document.getElementById('f-name').value.trim();
  const amount = document.getElementById('f-amount').value.trim();
  const email = document.getElementById('f-email').value.trim() || 'hello@dropinn.com';
  const fmt = v => { if(!v) return ''; if(v.startsWith('$')) return v; const n=Number(v.replace(/[^0-9]/g,'')); return isNaN(n)?v:'$'+n.toLocaleString(); };
  const amt = fmt(amount);

  const b64 = key => pdfs[key] ? pdfs[key].split(',')[1] : '';

  const viewer = (key, label) => pdfs[key]
    ? `<div class="pdf-viewer-wrap"><div class="pdf-viewer-label">${label}<a id="dl-${key}" class="pdf-open-btn" href="#" target="_blank" rel="noopener">Open PDF ↗<\/a><\/div><object class="pdf-frame" id="pdf-${key}" type="application\/pdf"><div class="pdf-fallback">PDF cannot display inline. <a id="dl2-${key}" href="#" target="_blank" rel="noopener">Open in new tab<\/a><\/div><\/object><\/div>`
    : `<div class="pdf-viewer-wrap pdf-placeholder"><div class="pdf-viewer-label">${label}<\/div><div class="pdf-empty">No document uploaded<\/div><\/div>`;

  const pdfScript = `
(function(){
  var data={operating:${JSON.stringify(b64('operating'))},commitment:${JSON.stringify(b64('commitment'))}};
  Object.keys(data).forEach(function(k){
    if(!data[k]) return;
    var bytes=atob(data[k]),arr=new Uint8Array(bytes.length);
    for(var i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([arr],{type:'application/pdf'}));
    var el=document.getElementById('pdf-'+k);
    if(el) el.data=url;
    ['dl-'+k,'dl2-'+k].forEach(function(id){var a=document.getElementById(id);if(a)a.href=url;});
  });
})();`;

  return `<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>Drop Inn — Investor Portal${name?' — '+name:''}<\/title>\n<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">\n<style>\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}\n:root{--cream:#F2EDE4;--sand:#C9A882;--bark:#6B4C35;--brown:#3D2B1F;--charcoal:#1A1A1A;--white:#fff;}\nhtml{scroll-behavior:smooth;}\nbody{font-family:'Barlow',sans-serif;background:var(--cream);color:var(--charcoal);min-height:100vh;overflow-x:hidden;}\nheader{background:var(--brown);padding:28px 6vw;display:flex;justify-content:space-between;align-items:center;}\n.header-brand{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;text-transform:uppercase;color:var(--white);letter-spacing:.1em;}\n.header-label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sand);}\n.hero-strip{background:var(--brown);padding:0 6vw 72px;}\n.hero-divider{width:100%;height:1px;background:rgba(255,255,255,.1);margin-bottom:56px;}\n.investor-greeting{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(38px,5vw,68px);text-transform:uppercase;color:var(--white);line-height:1.02;letter-spacing:-.01em;}\n.investor-greeting span{color:var(--sand);}\n.investor-sub{font-family:'Barlow',sans-serif;font-size:16px;color:rgba(255,255,255,.45);margin-top:18px;max-width:480px;line-height:1.65;}\n.stats-bar{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:6px;display:flex;margin-top:48px;overflow:hidden;}\n.stat-item{flex:1;padding:22px 28px;border-right:1px solid rgba(255,255,255,.08);}\n.stat-item:last-child{border-right:none;}\n.stat-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:8px;}\n.stat-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;color:var(--white);letter-spacing:-.01em;}\n.stat-val.accent{color:var(--sand);}\n@media(max-width:640px){.stats-bar{flex-direction:column;}.stat-item{border-right:none;border-bottom:1px solid rgba(255,255,255,.08);}.stat-item:last-child{border-bottom:none;}}\nmain{padding:72px 6vw 120px;max-width:1100px;margin:0 auto;}\n.section-tag{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sand);margin-bottom:14px;}\n.section-heading{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(30px,3.5vw,48px);text-transform:uppercase;color:var(--brown);line-height:1;margin-bottom:8px;}\n.section-sub{font-size:16px;color:#888;line-height:1.65;margin-bottom:56px;max-width:560px;}\n.pdf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:32px;margin-bottom:72px;}\n.pdf-viewer-wrap{background:var(--white);border-radius:6px;border:1px solid rgba(0,0,0,.07);overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.06);}\n.pdf-viewer-label{background:var(--brown);padding:16px 24px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--white);display:flex;align-items:center;gap:10px;justify-content:space-between;}\n.pdf-open-btn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sand);border:1px solid rgba(201,168,130,.5);padding:6px 12px;border-radius:2px;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:background .2s,color .2s;}\n.pdf-open-btn:hover{background:var(--sand);color:var(--brown);}\n.pdf-viewer-label::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sand);}\n.pdf-frame{width:100%;height:680px;border:none;display:block;background:#f5f5f5;overflow:auto;}\n.pdf-fallback{padding:48px 24px;text-align:center;font-size:14px;color:#999;line-height:1.7;}\n.pdf-fallback a{color:var(--bark);font-weight:500;}\n.pdf-empty{padding:80px 24px;text-align:center;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:#bbb;text-transform:uppercase;}\n.pdf-placeholder .pdf-viewer-label{opacity:.5;}\n.notice{background:rgba(201,168,130,.12);border:1px solid rgba(201,168,130,.35);border-radius:4px;padding:20px 24px;display:flex;gap:16px;align-items:flex-start;margin-bottom:72px;}\n.notice-icon{flex-shrink:0;width:20px;height:20px;margin-top:2px;color:var(--sand);}\n.notice-text{font-size:14px;color:#666;line-height:1.65;}\n.notice-text strong{color:var(--charcoal);font-weight:600;}\n.contact-strip{background:var(--brown);border-radius:6px;padding:40px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;}\n.contact-heading{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;text-transform:uppercase;color:var(--white);margin-bottom:6px;}\n.contact-sub{font-size:15px;color:rgba(255,255,255,.45);}\n.contact-link{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sand);border:1px solid rgba(201,168,130,.4);padding:14px 22px;border-radius:3px;text-decoration:none;transition:background .25s,color .25s;}\n.contact-link:hover{background:var(--sand);color:var(--brown);}\nfooter{background:var(--charcoal);padding:28px 6vw;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}\n.footer-brand{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;text-transform:uppercase;color:rgba(255,255,255,.3);letter-spacing:.1em;}\n.footer-note{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.18);text-transform:uppercase;}\n.fade-up{opacity:0;transform:translateY(32px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1);}\n.fade-up.visible{opacity:1;transform:translateY(0);}\n.fade-up.d1{transition-delay:.1s;}.fade-up.d2{transition-delay:.2s;}\n<\/style>\n<\/head>\n<body>\n<header><span class="header-brand">Drop Inn<\/span><span class="header-label">Investor Portal<\/span><\/header>\n<div class="hero-strip"><div class="hero-divider"><\/div><div class="investor-greeting">Welcome,<br><span>${name||'Investor'}<\/span><\/div><p class="investor-sub">The following documents are prepared exclusively for your review as part of your investment in Drop Inn, South Oceanside CA.<\/p><div class="stats-bar"><div class="stat-item"><div class="stat-label">Property<\/div><div class="stat-val">South Oceanside, CA<\/div><\/div><div class="stat-item"><div class="stat-label">Rooms<\/div><div class="stat-val">16<\/div><\/div>${amt?'<div class="stat-item"><div class="stat-label">Your Commitment<\/div><div class="stat-val accent">'+amt+'<\/div><\/div>':''}<div class="stat-item"><div class="stat-label">Document Status<\/div><div class="stat-val accent">Ready to Review<\/div><\/div><\/div><\/div>\n<main><div class="section-tag fade-up">Your Documents<\/div><div class="section-heading fade-up d1">Investment<br>Documentation<\/div><p class="section-sub fade-up d2">Review your executed documents below. Click \'Open PDF\' if the viewer doesn\'t load inline.<\/p><div class="pdf-grid fade-up d1">${viewer('operating','Operating Agreement')}${viewer('commitment','Commitment Letter')}<\/div><div class="notice fade-up"><svg class="notice-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.5" stroke="currentColor" stroke-width="1.5"\/><line x1="10" y1="9" x2="10" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"\/><circle cx="10" cy="6.5" r="0.75" fill="currentColor"\/><\/svg><p class="notice-text"><strong>Confidential.<\/strong> These documents are intended solely for the named investor and may not be shared, reproduced, or distributed without prior written consent from Drop Inn LLC.<\/p><\/div><div class="contact-strip fade-up"><div><div class="contact-heading">Questions?<\/div><p class="contact-sub">We&#39;re available to walk through any part of these documents.<\/p><\/div><a class="contact-link" href="mailto:${email}">Email Us<\/a><\/div><\/main>\n<footer><span class="footer-brand">Drop Inn — South Oceanside<\/span><span class="footer-note">Confidential Investor Materials &copy; 2025<\/span><\/footer>\n<script>const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}}),{threshold:.1});document.querySelectorAll('.fade-up').forEach(el=>obs.observe(el));${pdfScript}<\/script>\n<\/body>\n<\/html>`;
}
function updatePreview() {
  document.getElementById('preview-frame').srcdoc = buildHtml();
}
function generate() {
  const name = document.getElementById('f-name').value.trim();
  const blob = new Blob([buildHtml()], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'drop-inn-portal-' + (name?name.toLowerCase().replace(/\s+/g,'-'):'investor') + '.html';
  a.click();
  URL.revokeObjectURL(url);
  const msg = document.getElementById('status-msg');
  msg.textContent = 'Downloaded successfully';
  msg.className = 'status-msg ok';
  setTimeout(()=>{msg.textContent='';msg.className='status-msg';},3000);
}
updatePreview();
</script>
</body>
</html>
